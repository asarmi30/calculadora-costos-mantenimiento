<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Calculadora de costos de mantenimiento</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Calculadora de costos de mantenimiento</h1>
  <div class="formulario">
    <input id="nombre" placeholder="Actividad (ej. Corregir error de login)">
    <select id="categoria">
      <option>Correctivo</option>
      <option>Adaptativo</option>
      <option>Perfectivo</option>
      <option>Preventivo</option>
    </select>
    <input id="horas" type="number" placeholder="Horas">
    <button id="agregar">Agregar</button>
  </div>
  <p id="mensaje" class="error"></p>

  <ul id="lista"></ul>
  <p id="total"></p>

  <script src="app.js"></script>
</body>
</html>
